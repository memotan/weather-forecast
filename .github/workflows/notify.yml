name: Weather Notify

on:
  schedule:
    - cron: "37 22 * * *" # 07:37 JST — 本日の天気予報
    - cron: "7 3 * * *"   # 12:07 JST — 本日午後〜夜の天気予報
    - cron: "7 11 * * *"  # 20:07 JST — 明日の天気予報
  workflow_dispatch:
    inputs:
      window:
        description: "通知ウィンドウ"
        required: true
        default: "morning"
        type: choice
        options:
          - morning
          - afternoon
          - evening

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Determine notification window
        id: window
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "value=${{ github.event.inputs.window }}" >> "$GITHUB_OUTPUT"
          else
            case "${{ github.event.schedule }}" in
              "37 22 * * *") echo "value=morning" >> "$GITHUB_OUTPUT" ;;
              "7 3 * * *") echo "value=afternoon" >> "$GITHUB_OUTPUT" ;;
              "7 11 * * *") echo "value=evening" >> "$GITHUB_OUTPUT" ;;
              *)
                echo "unexpected schedule: ${{ github.event.schedule }}"
                exit 1
                ;;
            esac
          fi

      - name: Send weather notification
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ secrets.NTFY_SERVER }}
        run: python -m weather_notify.cli --window "${{ steps.window.outputs.value }}"
